<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécharger Jirig Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0058A3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .store-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .store-link {
            background: white;
            color: #0058A3;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .store-link:hover {
            transform: translateY(-2px);
        }

        .coming-soon {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .hint {
            font-size: 13px;
            opacity: 0.6;
            margin-top: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div id="content" class="container">
        <div class="spinner"></div>
        <p>Redirection vers le store...</p>
    </div>

    <script>
        // Redirection vers les stores, selon la plateforme détectée.
        //
        // Cette page est la cible des QR codes AFFICHÉS DANS LE SITE (générés à
        // chaud par QrImageView via AppStoreRedirect.getQRCodeUrl()).
        //
        // ⚠️ À ne pas confondre avec web/app_redirect.html, qui est la cible des
        // QR codes DÉJÀ IMPRIMÉS (flyers, affiches) et qui redirige, lui, vers
        // le site web. Les deux pages sont indépendantes : modifier l'une
        // n'affecte jamais l'autre.
        (function () {
            var ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.simplifystack.jirigWebApp';
            var WEBSITE_URL = 'https://jirig.shop';
            var REDIRECT_KEY = 'jirig_store_redirected';

            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            var isAndroid = /android/i.test(ua);

            // Rend le HTML une fois le DOM prêt (le script est dans <head>).
            function render(html) {
                function apply() {
                    var content = document.getElementById('content');
                    if (content) content.innerHTML = html;
                }
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', apply);
                } else {
                    apply();
                }
            }

            if (isAndroid) {
                // Anti-boucle : après un retour arrière depuis le Play Store, on
                // renvoie vers le site plutôt que de relancer la redirection.
                var hasBeenRedirected = null;
                try {
                    hasBeenRedirected = sessionStorage.getItem(REDIRECT_KEY);
                } catch (e) {
                    // sessionStorage indisponible (navigation privée, cookies bloqués) :
                    // on redirige quand même, sans protection anti-boucle.
                }

                if (!hasBeenRedirected) {
                    try {
                        sessionStorage.setItem(REDIRECT_KEY, 'true');
                    } catch (e) { /* ignoré */ }
                    window.location.replace(ANDROID_STORE_URL);
                } else {
                    window.location.replace(WEBSITE_URL);
                }

            } else if (isIOS) {
                // L'app n'est pas encore publiée sur l'App Store.
                render(
                    '<div style="margin-bottom:16px;"><i class="fa-brands fa-apple" style="font-size: 60px;"></i></div>' +
                    '<h2>Bientôt disponible sur iOS</h2>' +
                    '<p style="font-size:16px; margin-bottom:24px;">' +
                    "L'application <strong>Jirig Shop</strong> est actuellement en cours de déploiement " +
                    'sur l\'App Store. Nous vous informerons dès sa disponibilité.' +
                    '</p>' +
                    '<a href="' + WEBSITE_URL + '" class="store-link">Visiter jirig.shop</a>' +
                    '<p class="hint">Disponible dès maintenant sur Android ✅</p>'
                );

            } else {
                // Desktop : proposer le téléchargement Android.
                render(
                    '<div class="logo">Jirig Shop ⬇️</div>' +
                    '<p>Choisissez votre plateforme pour télécharger l\'application</p>' +
                    '<div class="store-links">' +
                    '<a href="' + ANDROID_STORE_URL + '" class="store-link">' +
                    '<i class="fa-brands fa-google-play"></i><span>Google Play</span>' +
                    '</a>' +
                    '<div class="coming-soon" style="width: 100%;">' +
                    '<i class="fa-brands fa-apple" style="font-size: 24px; margin-bottom: 10px;"></i>' +
                    '<p style="margin-bottom: 0;">App Store : Bientôt disponible</p>' +
                    '</div>' +
                    '</div>'
                );
            }
        })();
    </script>
</body>
</html>
