<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection...</title>

    <!-- Repli sans JavaScript : redirige au bout de 1s si le script ne s'exécute pas -->
    <noscript>
        <meta http-equiv="refresh" content="1; url=https://jirig.shop">
    </noscript>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0058A3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loader {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        p {
            margin: 0;
            font-size: 16px;
            opacity: 0.9;
        }

        /* Lien de secours : masqué au départ, affiché si la redirection n'aboutit pas */
        .fallback-link {
            display: none;
            background: white;
            color: #0058A3;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-top: 24px;
        }
    </style>

    <script>
        // Redirection vers le site web, quelle que soit la plateforme.
        //
        // Cette page est la cible des QR codes déjà imprimés (affiches, flyers).
        // Elle redirigeait auparavant vers Google Play / App Store ; elle pointe
        // désormais vers le site web. Conserver cette URL en ligne : c'est le
        // point de contrôle qui permet de changer la destination des supports
        // physiques sans les réimprimer.
        (function () {
            var TARGET = 'https://jirig.shop';

            // Sécurité anti-boucle : si cette page est servie depuis jirig.shop et
            // que la cible est la même origine, on ne se redirige pas sur soi-même.
            try {
                var target = new URL(TARGET);
                var samePage = target.origin === window.location.origin &&
                    target.pathname.replace(/\/+$/, '') === window.location.pathname.replace(/\/+$/, '');
                if (samePage) return;
            } catch (e) {
                // URL non supportée (très vieux navigateur) : on redirige quand même
            }

            // replace() plutôt que href : la page de redirection ne reste pas dans
            // l'historique, donc le bouton « retour » ne ramène pas ici.
            window.location.replace(TARGET);
        })();
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Redirection vers jirig.shop...</p>
        <a id="fallback" class="fallback-link" href="https://jirig.shop">Continuer vers jirig.shop</a>
    </div>

    <script>
        // Si la redirection n'a pas abouti au bout de 2,5s (blocage, réseau lent),
        // proposer un lien manuel plutôt que de laisser un spinner infini.
        setTimeout(function () {
            var link = document.getElementById('fallback');
            if (link) link.style.display = 'inline-block';
        }, 2500);
    </script>
</body>
</html>
