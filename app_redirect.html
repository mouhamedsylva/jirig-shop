<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0058A3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .loader {
            text-align: center;
            color: white;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        p {
            margin: 0;
            font-size: 16px;
            opacity: 0.9;
        }
        
        .message-container {
            text-align: center;
            padding: 40px 20px;
            color: white;
            max-width: 500px;
        }
        
        .message-container h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .message-container p {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .store-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .store-link {
            background: white;
            color: #0058A3;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        
        .store-link:hover {
            transform: translateY(-2px);
        }
    </style>
    
    <script>
        // 🚀 REDIRECTION INTELLIGENTE avec détection de retour arrière
        (function() {
            const REDIRECT_KEY = 'jirig_redirected';
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            
            // Détection iOS
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            
            // Détection Android
            const isAndroid = /android/i.test(ua);
            
            // Vérifier si l'utilisateur a déjà été redirigé (retour arrière)
            const hasBeenRedirected = sessionStorage.getItem(REDIRECT_KEY);
            
            if (isIOS || isAndroid) {
                if (!hasBeenRedirected) {
                    // 🔥 PREMIÈRE VISITE : Redirection immédiate vers le store
                    sessionStorage.setItem(REDIRECT_KEY, 'true');
                    
                    if (isIOS) {
                        window.location.replace('https://apps.apple.com/sn/app/moytou-mbeund/id6667094338?l=fr-FR');
                    } else {
                        window.location.replace('https://play.google.com/store/apps/details?id=com.simplifystack.jirigWebApp');
                    }
                } else {
                    // 🔄 RETOUR ARRIÈRE : Redirection vers jirig.shop
                    window.location.replace('https://jirig.shop');
                }
            } else {
                // 💻 DESKTOP : Afficher les deux liens
                window.addEventListener('DOMContentLoaded', function() {
                    document.body.innerHTML = `
                        <div class="message-container">
                            <h1>Jirig 🛒</h1>
                            <p>Scannez ce QR code avec votre mobile pour télécharger l'application</p>
                            <div class="store-links">
                                <a href="https://apps.apple.com/sn/app/moytou-mbeund/id6667094338?l=fr-FR" class="store-link">
                                    <span>🍎</span>
                                    <span>App Store</span>
                                </a>
                                <a href="https://play.google.com/store/apps/details?id=com.simplifystack.jirigWebApp" class="store-link">
                                    <span>▶️</span>
                                    <span>Google Play</span>
                                </a>
                            </div>
                        </div>
                    `;
                });
            }
        })();
    </script>
</head>
<body>
    <!-- Loader minimal affiché pendant la redirection (visible < 100ms) -->
    <div class="loader">
        <div class="spinner"></div>
        <p>Redirection...</p>
    </div>
</body>
</html>
